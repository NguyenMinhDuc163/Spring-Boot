spring.application.name=spring-boot-non-jwt
server.port=8080
# chi map du lieu, khong update, khong tao moi
spring.jpa.hibernate.ddl-auto=none

# xoa cac bang da co tao moi quan he, cac bang khong lq khong dung den
#spring.jpa.hibernate.ddl-auto=create

# update du lieu, khong xoa bang, khong tao moi quan he
#spring.jpa.hibernate.ddl-auto=update

# xoa toan bo bang va tao lai
#spring.jpa.hibernate.ddl-auto=create-drop

#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect

#tuy phien ban de chon Dialect cho phu hop voi loai csdl nao
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.properties.hibernate.enable_lazy_load_no_trans = true

#show cau lenh sql
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#debug=true

spring.profiles.active=pro